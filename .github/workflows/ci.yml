name: CI

# Pull requests run once here. Push CI is limited to main so an internal PR does
# not produce a duplicate push run. A successful main push unlocks release.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Conventional commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Test release policy
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate PR title and commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/${BASE_REF}"
            args+=(--title "$PR_TITLE")
          elif [ -n "${BEFORE_SHA:-}" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            echo "No parent commit to validate."
            exit 0
          fi

          python .github/scripts/release_policy.py validate-range \
            --base "$base" \
            --head HEAD \
            "${args[@]}"

  lint-and-test:
    name: Lint & unit tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance/mcp
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test tooling
        # Ruff is pinned because lint and formatting rules change between versions.
        run: python -m pip install --upgrade pip "ruff==0.13.2" pytest
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest -m 'not integration'

  protocol-conformance:
    name: MCP 2026 + legacy conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: appliance/mcp/requirements.txt
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: cli/qmtctl/go.sum
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Install locked MCP runtime
        working-directory: appliance/mcp
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install "pytest==9.0.2"
      - name: Official SDK integration tests
        working-directory: appliance/mcp
        run: pytest -m integration
      - name: Run official server and qmtctl conformance
        env:
          CONFORMANCE_PACKAGE: "@modelcontextprotocol/conformance@0.2.0-alpha.10"
        run: |
          set -euo pipefail
          mkdir -p conformance-results

          PYTHONPATH=appliance/mcp \
          MCP_HOST=127.0.0.1 \
          MCP_PORT=18766 \
          QMT_MCP_ALLOW_UNAUTH_LOOPBACK=1 \
          QMT_MCP_ENABLE_XTDATA=0 \
          QMT_MCP_TASK_CONFORMANCE_FIXTURES=1 \
          QMT_MCP_TASK_STORE="${RUNNER_TEMP}/qmt-mcp-conformance-tasks.sqlite3" \
          QMT_MCP_AUDIT_PATH="${RUNNER_TEMP}/qmt-mcp-conformance-audit.jsonl" \
            python appliance/mcp/qmt_mcp.py \
              >conformance-results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18766/livez >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat conformance-results/server.log
              exit 1
            fi
            sleep 1
          done

          for scenario in tools-list caching http-header-validation; do
            npx --yes "$CONFORMANCE_PACKAGE" server \
              --url http://127.0.0.1:18766/mcp \
              --spec-version 2026-07-28 \
              --scenario "$scenario" \
              --output-dir "conformance-results/server-modern-${scenario}"
          done
          for scenario in \
            tasks-lifecycle \
            tasks-capability-negotiation \
            tasks-wire-fields \
            tasks-request-state-removal \
            tasks-request-headers \
            tasks-dispatch-and-envelope \
            tasks-required-task-error \
            tasks-mrtr-input \
            tasks-mrtr-composition; do
            npx --yes "$CONFORMANCE_PACKAGE" server \
              --url http://127.0.0.1:18766/mcp \
              --spec-version 2026-07-28 \
              --scenario "$scenario" \
              --force \
              --output-dir "conformance-results/server-modern-${scenario}"
          done
          # alpha.10 records this scenario as pending while its
          # subscriptions/listen harness is rewritten. Keep it visible in CI;
          # executable acceptance lives in the Python/Go integration suites.
          npx --yes "$CONFORMANCE_PACKAGE" server \
            --url http://127.0.0.1:18766/mcp \
            --spec-version 2026-07-28 \
            --scenario tasks-status-notifications \
            --force \
            --output-dir \
              conformance-results/server-modern-tasks-status-notifications
          for scenario in server-initialize ping tools-list; do
            npx --yes "$CONFORMANCE_PACKAGE" server \
              --url http://127.0.0.1:18766/mcp \
              --spec-version 2025-11-25 \
              --scenario "$scenario" \
              --output-dir "conformance-results/server-legacy-${scenario}"
          done

          go build -C cli/qmtctl \
            -o "${RUNNER_TEMP}/qmtctl-conformance" \
            ./cmd/conformance
          for scenario in tools_call request-metadata http-standard-headers; do
            npx --yes "$CONFORMANCE_PACKAGE" client \
              --command "${RUNNER_TEMP}/qmtctl-conformance" \
              --spec-version 2026-07-28 \
              --scenario "$scenario" \
              --output-dir "conformance-results/client-modern-${scenario}"
          done
          for scenario in initialize tools_call; do
            npx --yes "$CONFORMANCE_PACKAGE" client \
              --command "${RUNNER_TEMP}/qmtctl-conformance" \
              --spec-version 2025-11-25 \
              --scenario "$scenario" \
              --output-dir "conformance-results/client-legacy-${scenario}"
          done
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-conformance
          path: conformance-results/

  appliance-image:
    name: Build appliance (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build and smoke appliance
        uses: docker/build-push-action@v7.3.0
        with:
          context: appliance
          file: appliance/Dockerfile
          platforms: linux/amd64
          # The Dockerfile defaults to the 1ms mirror for domestic users. GitHub
          # runners use Google's Docker Hub mirror so a partial domestic mirror
          # cannot leave the manifest pointing at a missing content layer.
          build-args: |
            WINE_BASE=mirror.gcr.io/scottyhardy/docker-wine:stable-11.0-20260531@sha256:76ef7a9f6170428f2753376c31974427163f23ac7f2d0314b0b451af1f4f43ca
            XRDP_BUILD_BASE=mirror.gcr.io/library/ubuntu:24.04@sha256:52df9b1ee71626e0088f7d400d5c6b5f7bb916f8f0c82b474289a4ece6cf3faf
          push: false
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=appliance-ci
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/qmt-mcp:buildcache
          cache-to: type=gha,scope=appliance-ci,mode=max
      - name: Verify Compose security defaults
        env:
          BROKER_PACK: /tmp/qmt-broker-pack
          QMT_MCP_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          set -euo pipefail
          docker compose -f appliance/docker-compose.yml config --format json > /tmp/qmt-compose.json
          docker compose -f appliance/docker-compose.tls.yml config --format json > /tmp/qmt-compose-tls.json
          python3 - <<'PY'
          import json

          def service(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)["services"]["qmt"]

          base = service("/tmp/qmt-compose.json")
          tls = service("/tmp/qmt-compose-tls.json")

          for qmt in (base, tls):
              assert "no-new-privileges:true" in qmt["security_opt"]
              assert qmt["cap_drop"] == ["ALL"]
              assert set(qmt["cap_add"]) == {
                  "CHOWN", "DAC_OVERRIDE", "KILL", "SETGID", "SETUID"
              }
              assert qmt["environment"]["QMT_RDP_PASSWORD"] == ""
              rdp = [port for port in qmt["ports"] if port["target"] == 3389]
              assert len(rdp) == 1 and rdp[0]["host_ip"] == "127.0.0.1"

          assert any(port["target"] == 8765 for port in base["ports"])
          assert all(port["target"] != 8765 for port in tls["ports"])
          PY

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-cli:
    name: Test & build qmtctl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/qmtctl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: cli/qmtctl/go.sum
      - name: Go test, vet and build
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./...
