name: CI

# Pull requests run once here. Push CI is limited to main so an internal PR does
# not produce a duplicate push run. A successful main push unlocks release.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Conventional commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Test release policy
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate PR title and commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/${BASE_REF}"
            args+=(--title "$PR_TITLE")
          elif [ -n "${BEFORE_SHA:-}" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            echo "No parent commit to validate."
            exit 0
          fi

          python .github/scripts/release_policy.py validate-range \
            --base "$base" \
            --head HEAD \
            "${args[@]}"

  lint-and-test:
    name: Lint & unit tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appliance/mcp
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install test tooling
        # Ruff is pinned because lint and formatting rules change between versions.
        run: python -m pip install --upgrade pip "ruff==0.13.2" pytest
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest -m 'not integration'

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-cli:
    name: Test & build qmtctl
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/qmtctl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.22"
          cache-dependency-path: cli/qmtctl/go.mod
      - name: Go test, vet and build
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go build ./...
