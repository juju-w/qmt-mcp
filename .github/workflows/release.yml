name: Release

# A successful main CI run automatically:
#   1. derives the SemVer bump from Conventional Commits;
#   2. updates VERSION and CHANGELOG in chore(release): vX.Y.Z [skip ci];
#   3. tags that release commit;
#   4. publishes the amd64 appliance image, six qmtctl packages, checksums, and
#      one GitHub Release.
#
# workflow_dispatch can retry an existing release from main or a selected v* tag.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to rebuild and republish; blank releases main"
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve and tag release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve version and create release commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RETRY_TAG: ${{ inputs.release_tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin

          publish=false
          version=""
          tag=""
          release_sha=""
          publish_latest=false

          if [ -n "${RETRY_TAG:-}" ]; then
            if [[ "$RETRY_TAG" != v* ]]; then
              echo "release_tag must use vX.Y.Z format." >&2
              exit 1
            fi
            tag="$RETRY_TAG"
            version="${tag#v}"
            python .github/scripts/release_policy.py validate-version "$version"
            release_sha="$(git rev-list -n 1 "$tag")"
            if [ -z "$release_sha" ]; then
              echo "Unknown release tag ${tag}." >&2
              exit 1
            fi
            file_version="$(git show "${tag}:VERSION" | tr -d '[:space:]')"
            if [ "$file_version" != "$version" ]; then
              echo "Tag ${tag} does not match VERSION=${file_version}." >&2
              exit 1
            fi
            publish=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            file_version="$(tr -d '[:space:]' < VERSION)"
            python .github/scripts/release_policy.py validate-version "$version"
            if [ "$file_version" != "$version" ]; then
              echo "Tag ${tag} does not match VERSION=${file_version}." >&2
              exit 1
            fi
            release_sha="$(git rev-parse HEAD)"
            publish=true
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual releases must run from main or an existing v* tag." >&2
              exit 1
            fi

            git pull --ff-only origin main
            current_sha="$(git rev-parse HEAD)"
            if [ "$EVENT_NAME" = "workflow_run" ] &&
               [ -n "${TESTED_SHA:-}" ] &&
               [ "$current_sha" != "$TESTED_SHA" ]; then
              echo "main advanced from tested ${TESTED_SHA} to ${current_sha}; a newer CI run will release it."
              {
                echo "publish=false"
                echo "version="
                echo "tag="
                echo "release_sha="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            head_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            if [ -n "$head_tag" ]; then
              tag="$head_tag"
              version="${tag#v}"
              python .github/scripts/release_policy.py validate-version "$version"
              file_version="$(tr -d '[:space:]' < VERSION)"
              if [ "$file_version" != "$version" ]; then
                echo "HEAD tag ${tag} does not match VERSION=${file_version}." >&2
                exit 1
              fi
              release_sha="$current_sha"
              publish=true
            else
              last_message="$(git log -1 --format='%s')"
              if [[ "$last_message" == chore\(release\):* ]]; then
                version="$(tr -d '[:space:]' < VERSION)"
                python .github/scripts/release_policy.py validate-version "$version"
                tag="v${version}"
                if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                  echo "Tag ${tag} already exists but is not attached to HEAD." >&2
                  exit 1
                fi
                git tag "$tag"
                git push origin "$tag"
                release_sha="$current_sha"
                publish=true
              else
                last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
                if [ -n "$last_tag" ]; then
                  current="${last_tag#v}"
                  policy="$(python .github/scripts/release_policy.py next-version \
                    --current "$current" --base-ref "$last_tag" --head HEAD)"
                else
                  current="$(tr -d '[:space:]' < VERSION)"
                  policy="$(python .github/scripts/release_policy.py next-version \
                    --current "$current" --head HEAD)"
                fi

                bump="$(printf '%s\n' "$policy" | sed -n 's/^bump=//p')"
                version="$(printf '%s\n' "$policy" | sed -n 's/^version=//p')"
                if [ "$bump" = "none" ]; then
                  echo "No releasable Conventional Commits since ${last_tag:-repository start}."
                  {
                    echo "publish=false"
                    echo "version=$current"
                    echo "tag="
                    echo "release_sha="
                  } >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                tag="v${version}"
                if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                  echo "Release tag ${tag} already exists." >&2
                  exit 1
                fi

                echo "Bump ${bump}: ${current} -> ${version}"
                printf '%s\n' "$version" > VERSION
                python .github/scripts/release_policy.py finalize-changelog \
                  --path CHANGELOG.md \
                  --version "$version" \
                  --previous-tag "${last_tag:-v${current}}" \
                  --repository "https://github.com/${REPOSITORY}"

                git add VERSION CHANGELOG.md
                git commit -m "chore(release): ${tag} [skip ci]"
                git push origin HEAD:main

                release_sha="$(git rev-parse HEAD)"
                git tag "$tag"
                git push origin "$tag"
                publish=true
              fi
            fi
          fi

          if [ "$publish" = "true" ]; then
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
            if [ "$tag" = "$latest_tag" ]; then
              publish_latest=true
            fi
          fi

          {
            echo "publish=$publish"
            echo "version=$version"
            echo "tag=$tag"
            echo "release_sha=$release_sha"
            echo "publish_latest=$publish_latest"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Build and push appliance image
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      mirror_image: ${{ steps.mirror-config.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/amd64
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: appliance
          file: appliance/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qmt-mcp:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.publish_latest == 'true' && format('ghcr.io/{0}/qmt-mcp:latest', github.repository_owner) || '' }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/qmt-mcp:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/qmt-mcp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Check optional China registry mirror
        id: mirror-config
        env:
          CN_REGISTRY: ${{ vars.QMT_MCP_CN_REGISTRY }}
          CN_IMAGE: ${{ vars.QMT_MCP_CN_IMAGE }}
          CN_USERNAME: ${{ secrets.QMT_MCP_CN_USERNAME }}
          CN_PASSWORD: ${{ secrets.QMT_MCP_CN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$CN_REGISTRY$CN_IMAGE$CN_USERNAME$CN_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "China registry mirror is not configured."
            exit 0
          fi
          if [ -z "$CN_REGISTRY" ] || [ -z "$CN_IMAGE" ] ||
             [ -z "$CN_USERNAME" ] || [ -z "$CN_PASSWORD" ]; then
            echo "China registry mirror configuration is incomplete." >&2
            exit 1
          fi
          case "$CN_IMAGE" in
            "$CN_REGISTRY"/*) ;;
            *)
              echo "QMT_MCP_CN_IMAGE must start with QMT_MCP_CN_REGISTRY/." >&2
              exit 1
              ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=$CN_IMAGE" >> "$GITHUB_OUTPUT"
      - name: Log in to China registry
        if: steps.mirror-config.outputs.enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ vars.QMT_MCP_CN_REGISTRY }}
          username: ${{ secrets.QMT_MCP_CN_USERNAME }}
          password: ${{ secrets.QMT_MCP_CN_PASSWORD }}
      - name: Mirror the published digest
        if: steps.mirror-config.outputs.enabled == 'true'
        env:
          CN_IMAGE: ${{ steps.mirror-config.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH_LATEST: ${{ needs.prepare.outputs.publish_latest }}
        run: |
          set -euo pipefail
          tags=(--tag "${CN_IMAGE}:${VERSION}")
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags+=(--tag "${CN_IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/qmt-mcp@${DIGEST}"

  cli:
    name: Package qmtctl for six targets
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/qmtctl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.22"
          cache-dependency-path: cli/qmtctl/go.mod
      - name: Test qmtctl
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Build release packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            package="qmtctl_${VERSION}_${os}_${arch}"
            stage="${RUNNER_TEMP}/${package}"
            mkdir -p "$stage"

            extension=""
            [ "$os" = "windows" ] && extension=".exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X github.com/juju-w/qmt-mcp/cli/qmtctl/internal/qmtctl.Version=${VERSION}" \
                -o "${stage}/qmtctl${extension}" .

            if [ "$os" = "windows" ]; then
              (
                cd "$stage"
                zip -q "${GITHUB_WORKSPACE}/cli/qmtctl/dist/${package}.zip" "qmtctl${extension}"
              )
            else
              tar -C "$stage" -czf "dist/${package}.tar.gz" qmtctl
            fi
          done

          (
            cd dist
            sha256sum qmtctl_* > SHA256SUMS
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: qmtctl-${{ needs.prepare.outputs.version }}
          path: cli/qmtctl/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, image, cli]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: qmtctl-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Create release body
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MIRROR_IMAGE: ${{ needs.image.outputs.mirror_image }}
        run: |
          {
            echo "QMT-MCP appliance \`${VERSION}\`."
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/qmt-mcp:${VERSION}\`"
            if [ -n "$MIRROR_IMAGE" ]; then
              echo "China mirror: \`${MIRROR_IMAGE}:${VERSION}\`"
            fi
            echo "Platforms: qmtctl for Linux, macOS, and Windows on amd64 and arm64."
            echo "Verify downloads with \`SHA256SUMS\`."
          } > release-body.md
      - name: Publish release and assets
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: release-body.md
          files: dist/*
