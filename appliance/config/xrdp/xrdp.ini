[Globals]
ini_version=1
fork=true
port=3389
runtime_user=xrdp
runtime_group=xrdp
tcp_nodelay=true
tcp_keepalive=true
security_layer=tls
crypt_level=high
certificate=/var/lib/qmt-rdp/cert.pem
key_file=/var/lib/qmt-rdp/key.pem
ssl_protocols=TLSv1.2, TLSv1.3
autorun=Xorg
require_credentials=true
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true
ConsoleLevel=INFO

[Channels]
rdpdr=false
rdpsnd=false
drdynvc=true
cliprdr=false
rail=false
xrdpvr=false

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
port=-1
code=20
h264_frame_interval=16
rfx_frame_interval=32
normal_frame_interval=40
