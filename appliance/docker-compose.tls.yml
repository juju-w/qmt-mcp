# Hardened standalone topology. The shared service definition lives in
# docker-compose.common.yml; this file owns only host publication and Caddy.
#
#   docker compose -f docker-compose.tls.yml up -d
services:
  qmt:
    extends:
      file: docker-compose.common.yml
      service: qmt-common
    container_name: "qmt-${INSTANCE:-tls}"
    ports:
      - "127.0.0.1:${RDP_PORT:-13389}:3389"
    expose:
      - "8765"
    environment:
      QMT_BEHIND_TLS_PROXY: "1"
      RDP_BIND_ADDRESS: "127.0.0.1"

  caddy:
    image: caddy:2
    container_name: "qmt-${INSTANCE:-tls}-caddy"
    depends_on:
      - qmt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    restart: unless-stopped

volumes:
  qmt-rdp-certs:
  caddy_data:
  caddy_config:
