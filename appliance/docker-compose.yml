services:
  qmt:
    extends:
      file: docker-compose.common.yml
      service: qmt-common
    ports:
      - "${RDP_BIND_ADDRESS:-127.0.0.1}:${RDP_PORT:-13389}:3389"
      - "${MCP_PORT:-18765}:8765"

  # Optional PostgreSQL warehouse. Start with `docker compose --profile db up`.
  db:
    image: postgres:16
    container_name: "qmt-${INSTANCE:-default}-db"
    profiles: ["db"]
    environment:
      POSTGRES_USER: "${QMT_DB_USER:-qmt}"
      POSTGRES_PASSWORD: "${QMT_DB_PASSWORD:-qmt}"
      POSTGRES_DB: "${QMT_DB_NAME:-qmt}"
    volumes:
      - "qmt-pgdata:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QMT_DB_USER:-qmt} -d ${QMT_DB_NAME:-qmt}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qmt-pgdata:
  qmt-rdp-certs:

# Multiple brokers on one host: use a distinct env file and Compose project for
# each instance so ports, broker packs, auth, DB, and RDP certificates stay
# isolated: `docker compose --env-file broker-a.env -p qmt-a up -d`.
